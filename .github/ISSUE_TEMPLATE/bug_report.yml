name: Bug Report
description: Report a reproducible bug or unexpected behavior in Butterfly
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please verify you are running the latest version of Butterfly before submitting.
        If you suspect a **security vulnerability**, do NOT file a public issue. Follow our [Security Policy](https://github.com/DnsChanger/dnsChanger-desktop/blob/main/SECURITY.md) instead.

  - type: dropdown
    id: platform
    attributes:
      label: Operating System
      description: Select your host operating system.
      options:
        - Linux (systemd-resolved)
        - Linux (NetworkManager / nmcli)
        - Linux (Other / Custom)
        - Windows 11 (23H2 / 24H2)
        - Windows 10 (22H2)
        - Windows (Other)
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which area of the application is failing?
      options:
        - Simple Shield Mode (HUD / Neon Power Shield)
        - DNS Resolvers Catalog & Custom DNS
        - Target Censorship Benchmark Engine
        - zapret2 DPI Engine (nfqws2 / winws2)
        - Driverless TLS Fragmentation Proxy (:8085)
        - Bulletproof DNS Safety Net (Restoration / state.json)
        - Cloudflare Clean-IP Scanner
        - System Tools Studio (My IP / Interface Switch / Scheduled Shutdown)
        - UI / Layout / Theme (Obsidian CyberTheme / RenderFlex)
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Butterfly Version or Git Commit
      description: e.g., v2.0.0 or git commit hash (run `git rev-parse --short HEAD`).
      placeholder: "e.g., 7c36e9c"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what the problem is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Launch Butterfly in Studio Mode
        2. Navigate to 'DPI Bypass' tab
        3. Select Strategy 'z-split' and tap 'Start Bypass'
        4. Observe error in Diagnostics console
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or Console Output
      description: Paste any relevant output from the Diagnostics tab or terminal.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-Submission Checklist
      options:
        - label: I have searched existing issues and verified this is not a duplicate.
          required: true
        - label: I have read and agree to follow Butterfly's [Code of Conduct](https://github.com/DnsChanger/dnsChanger-desktop/blob/main/CODE_OF_CONDUCT.md).
          required: true
        - label: This report contains no private or sensitive credentials.
          required: true
